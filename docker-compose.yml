services:
  backend:
    image: aayush44/devops-backend
    container_name: backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://ayushs:Aayush28@cluster0.cl24ook.mongodb.net/Personal_DB
      - JWT_SECRET=supersecretkey

  frontend:
    image: aayush44/devops-backend
    container_name: frontend
    environment:
      - VITE_API_URL=
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend