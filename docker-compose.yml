services:
  backend:
    image: aayush44/devops-backend
    container_name: backend
    env_file:
      - .env
    restart: always

  frontend:
    image: aayush44/devops-frontend
    container_name: frontend
    environment:
      - VITE_API_URL=
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always