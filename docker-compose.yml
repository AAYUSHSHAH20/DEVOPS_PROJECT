version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend
    environment:
      - MONGO_URI=mongodb+srv://ayushs:Aayush28@cluster0.cl24ook.mongodb.net/Personal_DB
      - JWT_SECRET=supersecretkey
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
